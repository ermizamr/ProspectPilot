[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prospectpilot"
version = "0.2.0"
description = "Evidence-Backed Developer-Prospecting Research Agent Powered by GitHub REST API"
authors = [{ name = "Ermyas Misiker", email = "89203924+ermizamr@users.noreply.github.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "agentic",
    "developer-tools",
    "prospecting",
    "lead-qualification",
    "github-api",
    "react-agent",
    "pydantic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7.0",
    "openai>=1.30.0",
    "httpx>=0.24.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.10.0",
]

[project.scripts]
prospectpilot = "prospectpilot.cli:main"

[project.urls]
Homepage = "https://github.com/ermizamr/ProspectPilot"
Repository = "https://github.com/ermizamr/ProspectPilot"
Issues = "https://github.com/ermizamr/ProspectPilot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["prospectpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-m 'not live'"
markers = [
    "live: opt-in tests requiring real API credentials (deselect with '-m not live')",
]
